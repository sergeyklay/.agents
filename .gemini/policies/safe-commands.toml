[[rule]]
toolName = "run_shell_command"
commandPrefix = [
    "cat",
    "head",
    "tail",
    "less",
    "wc",
    "file",
    "stat",
    "md5sum",
    "sha256sum",
]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = [
    "ls",
    "tree",
    "find",
    "fd",
    "pwd",
    "basename",
    "dirname",
    "realpath",
]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = [
    "grep",
    "rg",
    "ag",
    "awk",
    "sed -n",
    "sort",
    "uniq",
    "diff",
    "comm",
]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = [
    "echo",
    "env",
    "printenv",
    "which",
    "type",
    "whoami",
    "id",
    "uname",
    "date",
    "hostname",
]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = ["git", "gh"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = [
    "make",
    "go build",
    "go test",
    "go vet",
    "go mod",
    "npm test",
    "npm run",
    "npx",
    "pnpm",
    "yarn",
    "cargo build",
    "cargo test",
    "cargo check",
    "cargo clippy",
    "python -m pytest",
    "python -m mypy",
    "composer",
    "php artisan",
    "phpunit",
]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = ["mkdir", "touch", "cp", "mv"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = [
    "apt list",
    "dpkg -l",
    "pip list",
    "pip show",
    "npm list",
    "npm info",
    "go list",
]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = ["docker", "docker-compose"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = ["curl", "wget"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandPrefix = ["sudo", "su", "shutdown", "reboot", "eval"]
decision = "deny"
deny_message = "Blocked: potentially destructive system command"
priority = 200

[[rule]]
toolName = "run_shell_command"
commandRegex = "(?:rm -rf /|rm -[-A-Za-z0-9_=./ ]* /[\\s\"]|mkfs|dd if=|:\\(\\)\\{)"
decision = "deny"
deny_message = "Blocked: potentially destructive system command"
priority = 200
