# Deny reading dotenv files.
#
# Gemini already refuses any path containing a bare `.env` segment, in
# WorkspaceContext.isPathWithinWorkspace, with no configuration. This file
# covers only what that built-in guard misses: `.env.local`, `.env.production`,
# `app.env`, and the rest of the `.env.*` and `*.env` family, while still
# permitting the checked-in example files. It mirrors the `permission.read`
# block in `.opencode/opencode.json` and `permissions.deny: ["Read(**/.env)"]`
# in `.claude/settings.json`.
#
# `argsPattern` is tested against the JSON-stringified tool arguments, so one
# pattern covers `read_file` (`absolute_path`) and `read_many_files` (`paths`).
#
# The table is singular `[[rule]]` and the field is `decision`. The plural
# `[[rules]]` and `action` spellings that Gemini's own shipped documentation
# uses load zero rules with zero errors, because PolicyFileSchema is a
# non-strict zod object keyed on `rule`.

[[rule]]
toolName = ["read_file", "read_many_files"]
argsPattern = "\\.env(?![a-zA-Z])(?![^\"]*\\.(example|sample|template|dist)\")"
decision = "deny"
priority = 300
denyMessage = "Reading dotenv files is denied by policy. Read the .env.example instead."
