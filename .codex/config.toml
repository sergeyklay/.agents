model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "never"
default_permissions = "full-access"

[permissions]

[permissions.full-access]

[permissions.full-access.filesystem]
":root" = "read"
"~" = "write"
":slash_tmp" = "write"
glob_scan_max_depth = 16

[permissions.full-access.filesystem.":workspace_roots"]
".env" = "deny"
"**/.env" = "deny"

[permissions.full-access.network]
enabled = true

[mcp_servers]

[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v2/mcp"

[mcp_servers.bpdb]
command = "sh"
args = ["-c", "exec \"${CODEX_HOME:-$HOME/.codex}/mcp/bpdb/run.sh\""]
env_vars = ["DATABASE_URL", "DATABASE_URI", "MCP_POOL_MIN", "MCP_POOL_MAX", "MCP_STATEMENT_TIMEOUT", "MCP_ROW_LIMIT", "MCP_SCHEMA_CACHE_TTL_MS", "MCP_LIST_CACHE_TTL_MS", "MCP_DEBUG"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.snyk]
command = "npx"
args = ["-y", "snyk@1.1307.2", "mcp", "-t", "stdio"]

[marketplaces]

[marketplaces.diagram-design]
source_type = "git"
source = "https://github.com/cathrynlavery/diagram-design.git"

[plugins]

[plugins."diagram-design@diagram-design"]
enabled = true

[tui]
status_line = ["model", "context-used", "context-window-size", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
