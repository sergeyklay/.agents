model_reasoning_effort: high
# Claude preloads these three skills and gives this agent no Skill tool, so it
# can see nothing else; the renderer ships the complement of this list as
# skills.config disable rules. Claude also grants this agent no Bash and no
# plugin or apps surface, so those features go.
features:
  shell_tool: false
  plugins: false
  apps: false
skills:
  - review-arch
  - review-spec
  - verify-impl
