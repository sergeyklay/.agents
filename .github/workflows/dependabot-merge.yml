# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    uses: sortie-ai/shared-workflows/.github/workflows/dependabot-merge.yml@6d471deb70b0fee52d42366fb84f76b95d8f957a # v1.2.0
    with:
      ci-workflow-name: CI
      merge-method: squash
    secrets:
      bot-token: ${{ secrets.CICDBOT_TOKEN }}
