name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: .tool-versions
          enable-cache: false

      - name: Validate Agent Skills
        shell: bash
        run: make validate

  basedpyright:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: .tool-versions
          enable-cache: false

      - name: Type-check Python scripts
        shell: bash
        run: make typecheck

  ruff:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: .tool-versions
          enable-cache: false

      - name: Check Python scripts
        shell: bash
        run: make lint

  shellcheck:
    name: Portability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell scripts
        shell: bash
        run: make lint-shell

  shfmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shfmt (version from .tool-versions)
        shell: bash
        run: |
          version="$(awk '$1 == "shfmt" {print $2}' .tool-versions)"
          if [ -z "$version" ]; then
            echo "No shfmt entry found in .tool-versions" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v${version}/shfmt_v${version}_linux_amd64" \
            -o "${HOME}/.local/bin/shfmt"
          # SHA256 of the release binary for the version above; update both
          # together when bumping shfmt in .tool-versions (the release ships
          # no checksum asset to verify against).
          echo "fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66  ${HOME}/.local/bin/shfmt" \
            | sha256sum --check -
          chmod +x "${HOME}/.local/bin/shfmt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Check shell script formatting
        shell: bash
        run: make fmt-shell
