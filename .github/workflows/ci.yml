# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODEJS_VERSION: 24.20.0
  UV_VERSION: 0.12.9
  OPENCODE_VERISON: 1.18.31
  GO_VERSION: 1.26.2
  GOPLS_VERSION: 0.22.0

  SHFMT_VERSION: 3.14.0
  SHFMT_SHA: fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66

  BATS_VERSION: 1.12.0
  BATS_SHA: e36b020436228262731e3319ed013d84fcd7c4bd97a1b34dee33d170e9ae6bab

  GEMINI_CLI_VERSION: 0.58.0
  GEMINI_CLI_SHA: 8ffeb9e7edddffb054764d00749f39e8cc9804ca9b38b9093f906dd2157322ae

  CODEX_CLI_VERSION: 0.154.0
  CODEX_CLI_SHA512: 155ff1d4e1d762ffe27e37f79978fd4e14d301671464de9c18845046147190a34e3ee226bb5596d1cf1ebf5bd4904f57187f747449d81b5b418c8931462920d3
  CODEX_LINUX_X64_SHA512: 6b8148dc0f2c1adc06aceaa5b6b3dbad2da16a3ac7406e7dd44c2645f891a0b31bd74571741b54196e20bba20955810d898180ee4dcfe239511c4a02654fecf5

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Validate Agent Skills
        shell: bash
        run: make validate

      - name: Run every tracked unit test suite
        shell: bash
        run: make test

  basedpyright:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Type-check Python scripts
        shell: bash
        run: make typecheck

  ruff:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Check Python scripts
        shell: bash
        run: make lint

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODEJS_VERSION }}

      - name: Lint Markdown files
        shell: bash
        run: make lint-markdown

  shellcheck:
    name: Portability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell scripts
        shell: bash
        run: make lint-shell

  shfmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shfmt
        shell: bash
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o "${HOME}/.local/bin/shfmt"

          echo "$SHFMT_SHA  ${HOME}/.local/bin/shfmt" | sha256sum --check -
          chmod +x "${HOME}/.local/bin/shfmt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Check shell script formatting
        shell: bash
        run: make fmt-shell

  install-test:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        shell: bash
        run: |
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" \
            -o "${RUNNER_TEMP}/bats.tar.gz"
          echo "${BATS_SHA}  ${RUNNER_TEMP}/bats.tar.gz" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/bats.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/bats-core-${BATS_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODEJS_VERSION }}

      - name: Install the Gemini CLI
        shell: bash
        run: |
          curl -fsSL "https://registry.npmjs.org/@google/gemini-cli/-/gemini-cli-${GEMINI_CLI_VERSION}.tgz" \
            -o "${RUNNER_TEMP}/gemini-cli.tgz"
          echo "${GEMINI_CLI_SHA}  ${RUNNER_TEMP}/gemini-cli.tgz" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/gemini-cli" "${RUNNER_TEMP}/gemini-bin"
          tar -xzf "${RUNNER_TEMP}/gemini-cli.tgz" -C "${RUNNER_TEMP}/gemini-cli"
          chmod +x "${RUNNER_TEMP}/gemini-cli/package/bundle/gemini.js"
          ln -s "${RUNNER_TEMP}/gemini-cli/package/bundle/gemini.js" \
            "${RUNNER_TEMP}/gemini-bin/gemini"
          echo "${RUNNER_TEMP}/gemini-bin" >> "${GITHUB_PATH}"

      - name: Install the Codex CLI
        shell: bash
        run: |
          curl -fsSL "https://registry.npmjs.org/@openai/codex/-/codex-${CODEX_CLI_VERSION}.tgz" \
            -o "${RUNNER_TEMP}/codex-cli.tgz"
          curl -fsSL "https://registry.npmjs.org/@openai/codex/-/codex-${CODEX_CLI_VERSION}-linux-x64.tgz" \
            -o "${RUNNER_TEMP}/codex-linux-x64.tgz"
          echo "${CODEX_CLI_SHA512}  ${RUNNER_TEMP}/codex-cli.tgz" | sha512sum --check -
          echo "${CODEX_LINUX_X64_SHA512}  ${RUNNER_TEMP}/codex-linux-x64.tgz" | sha512sum --check -

          codex_root="${RUNNER_TEMP}/codex/lib/node_modules/@openai/codex"
          platform_root="${codex_root}/node_modules/@openai/codex-linux-x64"
          mkdir -p "${platform_root}" "${RUNNER_TEMP}/codex/bin"
          tar -xzf "${RUNNER_TEMP}/codex-cli.tgz" -C "${codex_root}" --strip-components=1
          tar -xzf "${RUNNER_TEMP}/codex-linux-x64.tgz" -C "${platform_root}" --strip-components=1
          ln -s "${codex_root}/bin/codex.js" "${RUNNER_TEMP}/codex/bin/codex"
          "${RUNNER_TEMP}/codex/bin/codex" --version | grep -Fx "codex-cli ${CODEX_CLI_VERSION}"
          echo "${RUNNER_TEMP}/codex/bin" >> "${GITHUB_PATH}"

      - name: Enable Linux user namespaces for Codex sandboxing
        shell: bash
        run: |
          set -euo pipefail

          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "${current_userns}" ] && [ "${current_userns}" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "${current_apparmor}" ] && [ "${current_apparmor}" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the installer test suite
        shell: bash
        run: make install-test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Set up Go for the real LSP fixture
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version:  ${{ env.GO_VERSION }}
          cache: false

      - name: Install the OpenCode runtime test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
          npm install --prefix "${RUNNER_TEMP}/opencode" --no-audit --no-fund opencode-ai@${OPENCODE_VERISON}
          GOBIN="${RUNNER_TEMP}/lsp-bin" go install golang.org/x/tools/gopls@v${GOPLS_VERSION}
          echo "${RUNNER_TEMP}/opencode/node_modules/.bin" >> "${GITHUB_PATH}"
          echo "${RUNNER_TEMP}/lsp-bin" >> "${GITHUB_PATH}"

      - name: Run isolated runtime scenarios
        run: make runtime-test
