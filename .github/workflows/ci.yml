name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: .tool-versions
          enable-cache: false

      - name: Validate Agent Skills
        shell: bash
        run: make validate

      - name: Run the skill validator unit tests
        shell: bash
        run: make test

  basedpyright:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: .tool-versions
          enable-cache: false

      - name: Type-check Python scripts
        shell: bash
        run: make typecheck

  ruff:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: .tool-versions
          enable-cache: false

      - name: Check Python scripts
        shell: bash
        run: make lint

  shellcheck:
    name: Portability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell scripts
        shell: bash
        run: make lint-shell

  shfmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shfmt
        shell: bash
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o "${HOME}/.local/bin/shfmt"

          echo "$SHFMT_SHA  ${HOME}/.local/bin/shfmt" | sha256sum --check -
          chmod +x "${HOME}/.local/bin/shfmt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        env:
          SHFMT_VERSION: 3.14.0
          SHFMT_SHA: fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66

      - name: Check shell script formatting
        shell: bash
        run: make fmt-shell

  install-test:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        shell: bash
        run: |
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" \
            -o "${RUNNER_TEMP}/bats.tar.gz"
          echo "${BATS_SHA}  ${RUNNER_TEMP}/bats.tar.gz" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/bats.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/bats-core-${BATS_VERSION}/bin" >> "${GITHUB_PATH}"
        env:
          BATS_VERSION: 1.12.0
          BATS_SHA: e36b020436228262731e3319ed013d84fcd7c4bd97a1b34dee33d170e9ae6bab

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - name: Install the Gemini CLI
        shell: bash
        run: |
          curl -fsSL "https://registry.npmjs.org/@google/gemini-cli/-/gemini-cli-${GEMINI_CLI_VERSION}.tgz" \
            -o "${RUNNER_TEMP}/gemini-cli.tgz"
          echo "${GEMINI_CLI_SHA}  ${RUNNER_TEMP}/gemini-cli.tgz" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/gemini-cli" "${RUNNER_TEMP}/gemini-bin"
          tar -xzf "${RUNNER_TEMP}/gemini-cli.tgz" -C "${RUNNER_TEMP}/gemini-cli"
          chmod +x "${RUNNER_TEMP}/gemini-cli/package/bundle/gemini.js"
          ln -s "${RUNNER_TEMP}/gemini-cli/package/bundle/gemini.js" \
            "${RUNNER_TEMP}/gemini-bin/gemini"
          echo "${RUNNER_TEMP}/gemini-bin" >> "${GITHUB_PATH}"
        env:
          GEMINI_CLI_VERSION: 0.58.0
          GEMINI_CLI_SHA: 8ffeb9e7edddffb054764d00749f39e8cc9804ca9b38b9093f906dd2157322ae

      - name: Run the installer test suite
        shell: bash
        run: make install-test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
