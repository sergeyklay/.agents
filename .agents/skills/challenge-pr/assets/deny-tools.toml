# Confine the second-opinion model to reading the checkout.
#
# The provider's headless prompt flag drives an agentic loop, not a
# one-shot completion. Left unrestricted the reviewer model runs shell
# commands, edits files, and reaches its own earlier transcripts under
# the provider's session store - at which point the "independent"
# opinion is quoting this project's previous runs back at us. It gets
# the diff on stdin and the checkout that diff applies to, nothing else.
#
# Rule order is priority order: the engine sorts by descending priority
# and stops at the first match. Deny-everything therefore sits below
# the allow rules; at the top of the order it matches every call and
# every rule under it is dead. Priorities fold into a tier band as
# tier + priority/1000 and a --policy file loads at the user tier, so
# the values here stay inside 0..999 and nothing outranks them without
# crossing into the admin band.
#
# The wildcard covers MCP-provided tools as well: whatever the settings
# file in force enables, a headless run loads, and those server
# instructions reach the model's context whether or not the tools are
# ever callable.
#
# The wildcard covers MCP-provided tools too: the host's global provider settings are still in effect for a headless run, and their server instructions arrive in the model's context whether or not they are ever callable. A rule whose toolName is "*" and whose mcpName is unset matches unconditionally, built-in and MCP alike, so no second rule is needed for them.
#
# What the wildcard stands in for, measured on both installed versions of the provider by asking the model to name its own callable functions with no policy in force: update_topic, list_directory, read_file, grep_search, glob, google_web_search, enter_plan_mode, invoke_agent - and, on this host only, run_shell_command. The shell tool is offered because the operator's own user-tier policy allows a list of command prefixes; a prefix rule carries an argsPattern, and only an argsPattern-free deny removes a tool from the model's declarations, so the allow leaves run_shell_command declared. Every write and execute tool the provider registers - write_file, replace, web_fetch, ask_user, activate_skill, write_todos, read_mcp_resource, list_mcp_resources, list_background_processes, read_background_output, exit_plan_mode, tracker_* - is already withheld in a headless run, because the shipped default for them is ask_user and ask_user means deny when there is nobody to ask.
#
# Three names are traps for any narrower policy written against this list. read_many_files passes the provider's rule validator, because the validator checks a name table that still carries it, but no version installed here registers it as a callable tool: the class survives only as the expander behind an @path in a prompt. Allowing it would grant nothing and denying it protects nothing. grep_search is the current name of the text search tool and search_file_content is its retired spelling; the provider expands one into the other before matching, so a single rule covers both and writing the pair is redundant. list_background_processes and read_background_output are registered and callable but absent from that same validator table, so a typo in either is accepted in silence rather than reported.
#
# Both installed versions - 0.54.4 under node 24.13.0 and 0.55.1 under node 24.14.1 - register the identical set of tools under the identical names, and their bundled name tables are byte-identical, so one policy is correct for both and no version guard is needed here.

[[rule]]
toolName = "*"
decision = "deny"
priority = 1

# The read-only four, spelled the way the provider's own read-only
# policy spells them. search_file_content needs no entry of its own:
# the engine expands legacy tool aliases to grep_search before matching
# a rule. invoke_agent is absent on purpose - a subagent arrives with
# its own tool set and would walk around this list rather than through
# it.

[[rule]]
toolName = ["read_file", "list_directory", "glob", "grep_search"]
decision = "allow"
priority = 500

# The provider's own state directory, spelled every way it can be
# spelled. The run points the provider's home at a throwaway directory,
# so what these rules take away is the operator's real ~/.gemini: the
# session transcripts of every other project the tool has been run in.
# They are also the layer that survives a shell tool being allowed back
# in, because run_shell_command never passes through the built-in path
# check at all.
#
# argsPattern is a regex over the serialised tool arguments, applied before the provider decodes %XX escapes, resolves .. or expands a glob. A bare '\.gemini' therefore misses /home/u/%2Egemini/... and misses /home/u/.gem*/... as well; both spellings were observed reading a seeded sentinel back out of the session store.
#
# Still open: a symlink committed to the base revision, which the
# provider resolves only after the policy check; a home directory that
# is neither /home/<user> nor /Users/<user>; Windows path spellings.
#
# Priorities are folded into a tier band as tier + priority/1000, and a --policy file loads at the user tier, so 999 is the largest value that stays inside the band. Nothing here can outrank these without crossing into the admin band.
#
# Still open: a symlink planted in the working directory, which the provider resolves only after the policy check; a home directory that is neither /home/<user> nor /Users/<user>; Windows path spellings.

[[rule]]
toolName = "*"
argsPattern = '(~|\$HOME|/home/[^/"]+|/Users/[^/"]+)/+(\.|%2[Ee]|)[Gg][Ee][Mm][Ii][Nn][Ii]'
decision = "deny"
priority = 999
denyMessage = "The provider's own state directory is out of bounds."

[[rule]]
toolName = "*"
argsPattern = '(~|\$HOME|/home/[^/"]+|/Users/[^/"]+)/[^"]*[*?[]'
decision = "deny"
priority = 999
denyMessage = "Wildcards are not allowed in paths under the home directory."
