<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>.agents — From idea to shipped code</title>
	<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;600&amp;display=swap" rel="stylesheet">
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		:root {
			--paper: #191b1a;
			--paper-2: #232624;
			--ink: #f3f0e8;
			--muted: #b3b8af;
			--rule: #424840;
			--accent: #f08a59;
			--sans: 'Geist', sans-serif;
			--serif: 'Instrument Serif', serif;
		}
		body { background: var(--paper); }
		svg { display: block; width: 100%; height: auto; font-family: var(--sans); }
		text { fill: var(--ink); }
		.brand { font-size: 36px; font-weight: 600; letter-spacing: -1px; }
		.eyebrow { fill: var(--muted); font-size: 16px; letter-spacing: 2px; }
		.headline { font-family: var(--serif); font-size: 80px; font-weight: 400; }
		.subtitle { fill: var(--muted); font-size: 24px; }
		.stage { font-size: 28px; font-weight: 600; text-anchor: middle; }
		.detail { fill: var(--muted); font-size: 16px; text-anchor: middle; }
		.resource { font-size: 24px; font-weight: 600; }
		.icon { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
		.connector { fill: none; stroke: var(--muted); stroke-width: 1.5; }
		.panel { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1.5; }
	</style>
</head>
<body>
	<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner-title banner-desc">
		<title id="banner-title">.agents — From idea to shipped code</title>
		<desc id="banner-desc">Ideas become plans, code, verified changes, and releases, with a refinement loop from verification to building and a shared playbook of context, skills, commands, and agents supporting the whole workflow.</desc>
		<defs>
			<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#b3b8af"/></marker>
			<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#f08a59"/></marker>
			<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#b3b8af"/></marker>
		</defs>
		<rect width="1200" height="630" fill="#191b1a"/>

		<circle cx="60" cy="64" r="4" fill="#f08a59"/>
		<text x="72" y="72" class="brand">agents</text>
		<text x="1144" y="68" text-anchor="end" class="eyebrow">YOUR WORKFLOW. EVERY CODING TOOL.</text>
		<text x="56" y="168" class="headline">From idea to shipped code.</text>
		<text x="60" y="216" class="subtitle">One shared playbook for you and your agents.</text>

		<g class="connector" marker-end="url(#arrow)">
			<path d="M180 336 H304"/>
			<path d="M400 336 H476"/>
			<path d="M692 336 H768"/>
			<path d="M880 336 H988"/>
			<path d="M824 292 V280 Q824 272 816 272 H592 Q584 272 584 280 V292" stroke-dasharray="4 4"/>
		</g>
		<rect x="640" y="240" width="128" height="24" fill="#191b1a"/>
		<text x="704" y="256" class="detail">Review &amp; refine</text>

		<g aria-label="Idea">
			<circle cx="128" cy="336" r="44" class="panel"/>
			<g class="icon">
				<path d="M120 344 C120 340 112 336 112 328 A16 16 0 0 1 144 328 C144 336 136 340 136 344 V348 H120 Z"/>
				<path d="M124 356 H132 M128 308 V304 M104 316 L100 312 M152 316 L156 312"/>
			</g>
			<text x="128" y="424" class="stage">Idea</text>
			<text x="128" y="456" class="detail">The brief</text>
		</g>

		<g aria-label="Plan">
			<rect x="328" y="292" width="64" height="80" rx="4" class="panel"/>
			<rect x="316" y="304" width="64" height="80" rx="4" fill="#292d28" stroke="#b3b8af" stroke-width="1.5"/>
			<g class="icon">
				<path d="M332 324 H364 M332 336 H352"/>
				<rect x="332" y="352" width="4" height="4"/>
				<path d="M344 356 H364 M344 368 H360"/>
			</g>
			<text x="352" y="424" class="stage">Plan</text>
			<text x="352" y="456" class="detail">Spec + tasks</text>
		</g>

		<g aria-label="Build">
			<rect x="488" y="292" width="192" height="88" rx="8" class="panel"/>
			<path d="M488 316 H680" stroke="#424840"/>
			<g fill="#b3b8af">
				<circle cx="504" cy="304" r="2"/>
				<circle cx="516" cy="304" r="2"/>
				<circle cx="528" cy="304" r="2"/>
			</g>
			<g class="icon">
				<path d="M556 336 L544 348 L556 360 M612 336 L624 348 L612 360 M588 332 L580 364"/>
			</g>
			<text x="584" y="424" class="stage">Build</text>
			<text x="584" y="456" class="detail">Code + tests</text>
		</g>

		<g aria-label="Verify">
			<rect x="780" y="292" width="88" height="88" rx="8" class="panel"/>
			<g class="icon">
				<path d="M824 308 L844 316 V336 Q844 352 824 364 Q804 352 804 336 V316 Z"/>
				<path d="M816 336 L824 344 L836 328"/>
			</g>
			<text x="824" y="424" class="stage">Verify</text>
			<text x="824" y="456" class="detail">Review + checks</text>
		</g>

		<g aria-label="Ship">
			<rect x="1000" y="284" width="112" height="104" rx="8" fill="#f08a59"/>
			<g fill="none" stroke="#191b1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
				<path d="M1032 324 L1056 312 L1080 324 V352 L1056 364 L1032 352 Z"/>
				<path d="M1032 324 L1056 336 L1080 324 M1056 336 V364 M1044 320 L1068 332 V344"/>
			</g>
			<text x="1056" y="424" class="stage">Ship</text>
			<text x="1056" y="456" class="detail">The release</text>
		</g>

		<path d="M56 508 H428 M772 508 H1144" stroke="#424840"/>
		<text x="600" y="512" text-anchor="middle" class="eyebrow">THE SHARED PLAYBOOK</text>

		<g class="icon" stroke="#b3b8af">
			<path d="M64 548 H76 Q80 548 80 552 Q80 548 84 548 H96 V568 H84 Q80 568 80 572 Q80 568 76 568 H64 Z M80 552 V572"/>
			<path d="M356 544 L364 556 L376 560 L364 564 L356 576 L348 564 L336 560 L348 556 Z"/>
			<path d="M616 548 L628 560 L616 572 M636 572 H652"/>
			<circle cx="904" cy="552" r="8"/>
			<path d="M888 576 V572 Q888 564 896 564 H912 Q920 564 920 572 V576 M924 544 A8 8 0 0 1 924 560 M928 568 Q936 568 936 576"/>
		</g>
		<text x="112" y="568" class="resource">Context</text>
		<text x="392" y="568" class="resource">Skills</text>
		<text x="668" y="568" class="resource">Commands</text>
		<text x="952" y="568" class="resource">Agents</text>
	</svg>
</body>
</html>
